[project]
name = "lightsout"
version = "0.1.0"
description = "Streetlight outages and nighttime pedestrian collisions in NYC (CS-GY 6513 project)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.3",
    "h3>=4.1,<5",
    "astral>=3.2",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
    "folium>=0.17",
    "pyyaml>=6",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightsout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
