# Local development on a single machine. All paths are relative to the repo root.
env: local
data_root: data

spark:
  master: "local[*]"
  driver_memory: 8g
  shuffle_partitions: 48
  hive: false            # true on Dataproc: tables are also registered in the Hive metastore
  database: lightsout

analysis:
  start_date: "2020-01-01"     # first date covered by the 311 dataset
  h3_resolution: 10            # hexagon edge about 66 m
  ring: 1                      # complaint footprint = its cell plus this many rings of neighbours
  cap_days: 90                 # spec A: longest outage window trusted from closed_date
  fixed_window_nights: 7       # spec B: nights after the report, ignoring closed_date
  twilight_buffer_min: 30      # sensitivity: drop crashes this close to sunrise/sunset
  event_window: 28             # event study: nights before/after the report
  train_end: "2024-12-31"      # score and classifier are fit on data up to this date
  label_nights: 7              # classifier label horizon

nyc:
  lat: 40.7128
  lon: -74.0060
  tz: America/New_York
  bbox: [40.47, -74.27, 40.93, -73.68]   # south, west, north, east
